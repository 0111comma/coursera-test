name: STOCK02 VOICEVOX
on:
  push:
    branches: [codex/stock02-orukan-leverage-20260913]
    paths: ['videos/STOCK02/script.json', 'videos/STOCK02/synthesize.py', '.github/workflows/stock02-audio.yml']
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg p7zip-full
          pip install numpy
      - name: Start VOICEVOX
        run: |
          sudo mkdir -p /opt/voicevox
          sudo chown -R "$USER:$USER" /opt/voicevox
          bash production/setup_voicevox.sh
      - name: Synthesize STOCK02
        run: python videos/STOCK02/synthesize.py
      - name: Compress narration losslessly
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          for p in Path('videos/STOCK02/output').glob('*.wav'):
              subprocess.run(['ffmpeg','-v','error','-y','-i',str(p),'-c:a','flac',str(p.with_suffix('.flac'))],check=True)
              p.unlink()
          PY
      - name: Preserve narration and phoneme timings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/STOCK02/output
          git commit -m "Preserve STOCK02 VOICEVOX narration and phoneme timings"
          git push origin HEAD:codex/stock02-orukan-leverage-20260913
      - uses: actions/upload-artifact@v4
        with:
          name: STOCK02-audio
          path: videos/STOCK02/output/
          retention-days: 7

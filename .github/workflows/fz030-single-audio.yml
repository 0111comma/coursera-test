name: FZ030 single short VOICEVOX
on:
  push:
    branches: [codex/fz030-short-rework-20260912]
    paths: ['videos/FZ030-rework/script.json', 'videos/FZ030-rework/synthesize.py', '.github/workflows/fz030-single-audio.yml']
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg p7zip-full
      - name: Start VOICEVOX
        run: |
          sudo mkdir -p /opt/voicevox
          sudo chown -R "$USER:$USER" /opt/voicevox
          bash production/setup_voicevox.sh
      - name: Synthesize this one revised short
        run: python videos/FZ030-rework/synthesize.py
      - name: Preserve generated audio on this work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/FZ030-rework/audio
          git commit -m "Preserve FZ030 revised VOICEVOX audio and synthesis manifest"
          git push origin HEAD:codex/fz030-short-rework-20260912
      - uses: actions/upload-artifact@v4
        with:
          name: FZ030-rework-audio
          path: videos/FZ030-rework/audio/
          retention-days: 7

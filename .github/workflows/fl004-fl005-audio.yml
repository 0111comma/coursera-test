name: FL004 FL005 VOICEVOX
on:
  push:
    branches: [codex/fl004-fl005-20260914]
    paths: ['videos/FL004/script.json', 'videos/FL005/script.json', '.github/workflows/fl004-fl005-audio.yml']
permissions:
  contents: write
jobs:
  audio:
    if: contains(github.event.head_commit.message, '[fx-nisa-audio]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg p7zip-full
          pip install numpy
      - name: Start VOICEVOX
        run: |
          sudo mkdir -p /opt/voicevox
          sudo chown -R "$USER:$USER" /opt/voicevox
          bash production/setup_voicevox.sh
      - name: Synthesize two performances
        run: |
          FINANCE_PROJECT=videos/FL004 python videos/FL004/engine/synthesize.py
          FINANCE_PROJECT=videos/FL005 python videos/FL005/engine/synthesize.py
      - name: Compress narration losslessly
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          for code in ['FL004','FL005']:
              for p in (Path('videos')/code/'output').glob('*.wav'):
                  subprocess.run(['ffmpeg','-v','error','-y','-i',str(p),'-c:a','flac',str(p.with_suffix('.flac'))],check=True)
                  p.unlink()
          PY
      - name: Preserve narration and phoneme timings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/FL004/output videos/FL005/output
          git commit -m "Preserve FL004 and FL005 VOICEVOX performances"
          git push origin HEAD:codex/fl004-fl005-20260914
      - uses: actions/upload-artifact@v4
        with:
          name: fx-nisa-audio
          path: |
            videos/FL004/output/
            videos/FL005/output/
          retention-days: 14
